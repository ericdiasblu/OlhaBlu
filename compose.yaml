name: ocorrencias

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?required}
      MYSQL_USER: ${DB_USER:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP -h 127.0.0.1 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --connect-timeout=3
          --execute="SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  api:
    image: ${API_IMAGE:-aex-api}:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    command:
      - sh
      - -ec
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
        --workers 1 --no-access-log --no-proxy-headers
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      OCCURRENCE_TTL_HOURS: "48"
      MODERATOR_EMAILS: ${MODERATOR_EMAILS:-}
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  web:
    image: ${WEB_IMAGE:-aex-web}:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    restart: unless-stopped
    init: true
    environment:
      DOMAIN: "${DOMAIN:-http://:80}"
      CADDY_ACME_EMAIL: "${ACME_EMAIL:+email }${ACME_EMAIL:-}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_HTTP_PORT:-8080}:80/tcp"
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_HTTPS_PORT:-8443}:443/tcp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/web"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
