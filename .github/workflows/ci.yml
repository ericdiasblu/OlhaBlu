name: Build da base
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.4.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/check-npm-sources.mjs
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m compileall -q app alembic
      - run: python -m alembic heads
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir e iniciar a aplicação
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 240
      - name: Conferir frontend, proxy, banco e migração
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -F '<div id="root">'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/occurrence-types |
            python -c 'import json, sys; types = json.load(sys.stdin); assert len(types) == 7 and any(t["slug"] == "alagamento" for t in types)'
      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar containers
        if: always()
        run: docker compose down -v
